name: Task Management API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  # JOB 1: Continuous Integration
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test


  # JOB 2: Build Docker Image and Push to Docker Hub
  docker:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: harisfarooqi/task-management-api:latest


  # JOB 3: Deploy Application on Ubuntu Machine
  deploy:
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Pull Latest Docker Image
        run: docker pull harisfarooqi/task-management-api:latest

      - name: Stop and Remove Old Container
        run: docker rm -f task-api-container || true

      - name: Run New Container
        run: |
          docker run -d \
            --name task-api-container \
            --restart unless-stopped \
            -p 4000:4000 \
            harisfarooqi/task-management-api:latest

      - name: Verify API
        run: |
          sleep 5
          curl --fail http://localhost:4000/health